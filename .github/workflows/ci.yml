name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # gate #5：零依赖不是声明，是机械判据（函数内 import 也扫）
      - name: Zero-dependency gate
        run: python scripts/check_stdlib.py

      # gate #6：测试实跑（29 个：种植 fixture 抓得到 + 干净对照不误报）
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

      # gate #7：CLI 退出码契约 —— 正例 exit 0
      - name: CLI contract — clean fixture exits 0
        run: python silentlint/cli.py scan tests/fixtures/clean_ast.py

      # gate #7：CLI 退出码契约 —— 反例 exit 1（BLOCK）。
      # shell: python 保证 Windows/Ubuntu 行为一致（$? 语义跨平台不同）
      - name: CLI contract — planted defects exit 1 (BLOCK)
        shell: python
        run: |
          import subprocess, sys
          r = subprocess.run([sys.executable, "silentlint/cli.py", "scan",
                              "tests/fixtures/planted/ast_defects.py"])
          print(f"exit={r.returncode} (expect 1)")
          sys.exit(0 if r.returncode == 1 else 1)

      # gate #8：Dogfood —— 本仓文档自扫。tests/fixtures 里是刻意种植的
      # bug，必须排除；BLOCK/ERROR 才算门失败，WARN 交给人判断。
      - name: Dogfood gate — repo self-scan must not BLOCK
        shell: python
        run: |
          import subprocess, sys
          r = subprocess.run([sys.executable, "silentlint/cli.py", "scan", ".",
                              "--exclude", "tests/fixtures"])
          print(f"self-scan exit={r.returncode} (0/2 pass, 1/3 fail)")
          sys.exit(0 if r.returncode in (0, 2) else 1)
